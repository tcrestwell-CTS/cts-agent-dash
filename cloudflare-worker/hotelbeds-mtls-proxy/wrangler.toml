# MUST match the Worker that HOTELBEDS_MTLS_PROXY_URL points to in production
# (https://cts-hotel-mtls-proxy.tcrestwell.workers.dev), otherwise `wrangler deploy`
# creates a second Worker and the live one keeps serving the old build.
name = "cts-hotel-mtls-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# mTLS certificate binding — upload via:
#   wrangler mtls-certificate upload --cert cert.pem --key key.pem --name hotelbeds-mtls
# The binding name must be HOTELBEDS_CERT — src/index.ts reads env.HOTELBEDS_CERT.
[[mtls_certificates]]
binding = "HOTELBEDS_CERT"
certificate_id = "<CERT_ID_AFTER_UPLOAD>"

[vars]
# mTLS-registered API keys MUST use the api-mtls hosts. The plain
# api[.test].hotelbeds.com hosts reject them (403 / 401 "non-mTLS endpoint").
HOTELBEDS_LIVE_ORIGIN = "https://api-mtls.hotelbeds.com"
HOTELBEDS_TEST_ORIGIN = "https://api-mtls.test.hotelbeds.com"
PROJECT_EXPEDITION_ORIGIN = "https://api.projectexpedition.com/v1"

# Set this secret via: wrangler secret put PROXY_AUTH_TOKEN
# Your Edge Function will send this token to authenticate with the worker
